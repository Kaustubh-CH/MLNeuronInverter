# CA3 Pyramidal — VOLTAGE-ONLY loss (4-stim multi). Fresh from scratch.
#
# Same 4-stim joint-channel data/model as ca3_multistim.hpar.yaml, but the loss
# is voltage-trace ONLY (mask_channels:True): no parameter supervision. HybridLoss
# re-sims pred_phys under each of the 4 stims and matches each simulated soma
# trace to the corresponding data channel.
#   loss = voltage_weight * mean_stim MSE( z(sim_s(pred_phys)), z(true_volts[...,s]) )

data_path:
  perlmutter: /pscratch/sd/k/ktub1999/synthetic_ca3_data/ca3_multistim_v1/

data_conf:
    # serialize_stims:True collapses the 4 stim PROBE channels into CNN input
    # channels (num_stims=1 -> no sample multiplication). See ca3_multistim.
    serialize_stims:  True
    append_stim:      False
    parallel_stim:    False
    num_data_workers: 4

max_epochs: 100
batch_size: 128

use_manual_features: False

const_local_batch: True
validation_period: [1, 1]

log_freq_per_epoch: 8
tb_show_graph: False

save_checkpoint: True
resume_checkpoint: False

do_ray: False
model_type: CNN

opt_pytorch:
    amp:       False
    apex:      False
    autotune:  False
    zerograd:  False

train_conf:
    warmup_epochs: 0
    optimizer: [adam, 0.0003]
    LRsched:   { plateau_patience: 10, reduceFactor: 0.3 }
    clip_grad_norm: 1.0

# ─────────────────────────────────────────────────────────────────────────
# VOLTAGE-ONLY loss (no channel/parameter supervision), multi-stim
# ─────────────────────────────────────────────────────────────────────────
use_voltage_loss: True
voltage_loss:
    cell_name_for_sim: ca3_pyramidal
    channel_weight:    0.0          # OFF
    voltage_weight:    1.0
    mask_channels:     True         # voltage-only
    stim_name:         5k50kInterChaoticB
    stim_names_multi:  [5k50kInterChaoticB, 5k0step_500, 5k0chirp, 5k0ramp]
    soma_probe_index:  0
    clamp_unit_tanh:   True
    t_max_override:    auto
    solver:            bwd_euler
    fp64:              True

model:
    myId:    ca3_multistim_voltonly
    comment: CA3 Pyramidal voltage-only (mask_channels) 4-stim
    outputSize_override: 6
    num_cnn_blocks: 2
    conv_block:
        filter: [30, 90, 180]
        kernel: [4,  4,  4]
        pool:   [4,  4,  4]

    instance_norm_slot:  -9
    layer_norm:          False
    batch_norm_cnn_slot: 3
    batch_norm_flat:     True

    fc_block:
       dims:    [512, 512, 512, 256, 128]
       dropFrac: 0.04
