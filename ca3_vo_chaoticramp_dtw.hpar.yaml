# CA3 Pyramidal — VOLTAGE-ONLY + soft-DTW loss, single-stim 5kChaoticRamp pack.
#
# Combines the chaoticRamp data (ca3_chaoticramp_v1, 5kChaoticRamp, 5000-sample)
# with the soft-DTW timing-robust distance (the A2_dtw loss), instead of the
# soft-eFEL feature loss. Soft-DTW aligns sim<->data traces under small temporal
# warps, so spike-timing jitter no longer produces the pointwise-MSE "cliff":
#   v = mse_weight * MSE(z(sim), z(data)) + dtw_weight * softDTW_gamma(z(sim), z(data))
# soft_dtw.py is downsampled to dtw_n_points and Sakoe-Chiba band-limited (dtw_band_ms)
# for cost. LR 1e-4 + clip 1.0 (voltage-only stability); clamp_unit_tanh + fp64 as in
# the chaoticRamp voltage-only baseline (requires JAX_ENABLE_X64=true in env).

data_path:
  perlmutter: /pscratch/sd/k/ktub1999/synthetic_ca3_data/ca3_chaoticramp_v1/

data_conf:
    serialize_stims:  True
    append_stim:      False
    parallel_stim:    False
    num_data_workers: 4

max_epochs: 100
batch_size: 128

use_manual_features: False
const_local_batch: True
validation_period: [1, 1]
log_freq_per_epoch: 8
tb_show_graph: False
save_checkpoint: True
resume_checkpoint: False
do_ray: False
model_type: CNN

opt_pytorch:
    amp:       False
    apex:      False
    autotune:  False
    zerograd:  False

train_conf:
    warmup_epochs: 0
    optimizer: [adam, 0.0001]
    LRsched:   { plateau_patience: 10, reduceFactor: 0.3 }
    clip_grad_norm: 1.0

use_voltage_loss: True
voltage_loss:
    cell_name_for_sim: ca3_pyramidal
    channel_weight:    0.0
    voltage_weight:    1.0
    mask_channels:     True
    stim_name:         5kChaoticRamp
    soma_probe_index:  0
    clamp_unit_tanh:   True
    range_penalty_weight: 0.0
    t_max_override:    auto
    solver:            bwd_euler
    fp64:              True
    # loss = PURE soft-DTW (no MSE anchor, efel OFF) -- user directive
    mse_weight:        0.0
    dtw_weight:        1.0
    dtw_gamma:         0.1
    dtw_n_points:      256
    dtw_band_ms:       8.0
    efel_weight:       0.0
    smooth_sigma:      0.0
    smooth_samples:    1
    lowpass_ms:        0.0

model:
    myId:    ca3_vo_chaoticramp_dtw
    comment: CA3 voltage-only + soft-DTW, single-stim 5kChaoticRamp
    outputSize_override: 6
    num_cnn_blocks: 2
    conv_block:
        filter: [30, 90, 180]
        kernel: [4,  4,  4]
        pool:   [4,  4,  4]
    instance_norm_slot:  -9
    layer_norm:          False
    batch_norm_cnn_slot: 3
    batch_norm_flat:     True
    fc_block:
       dims:    [512, 512, 512, 256, 128]
       dropFrac: 0.04
