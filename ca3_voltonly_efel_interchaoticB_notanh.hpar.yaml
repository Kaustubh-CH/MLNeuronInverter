# CA3 Pyramidal — VOLTAGE-ONLY + soft-eFEL, 4k50kInterChaoticB pack, NO-TANH.
#
# NO-TANH ablation (clamp_unit_tanh:False) trained FROM SCRATCH on the
# 4k50kInterChaoticB stimulus pack. Architecture/optimizer identical to the
# chaoticramp no-tanh run (kernel=4, from scratch, 100ep, LR 1e-4) so the only
# variables vs that run are the stimulus/data pack.
#   v = mse_weight * MSE(z(sim), z(data)) + efel_weight * Huber(soft_eFEL(sim) - soft_eFEL(data))
#
# 4k50kInterChaoticB = 4000 samples @0.1ms = 400 ms. t_max_override:auto reads
# 400 ms back from the pack meta at train time.

data_path:
  perlmutter: /pscratch/sd/k/ktub1999/synthetic_ca3_data/ca3_4kinterchaoticB_v1/

data_conf:
    serialize_stims:  True
    append_stim:      False
    parallel_stim:    False
    num_data_workers: 4

max_epochs: 100
batch_size: 128

use_manual_features: False

const_local_batch: True
validation_period: [1, 1]

log_freq_per_epoch: 8
tb_show_graph: False

save_checkpoint: True
resume_checkpoint: False

do_ray: False
model_type: CNN

opt_pytorch:
    amp:       False
    apex:      False
    autotune:  False
    zerograd:  False

train_conf:
    warmup_epochs: 0
    optimizer: [adam, 0.0001]     # soft-eFEL diverges at 3e-4
    LRsched:   { plateau_patience: 10, reduceFactor: 0.3 }
    clip_grad_norm: 1.0

# ─────────────────────────────────────────────────────────────────────────
# VOLTAGE-ONLY loss (no channel supervision) + soft-eFEL feature matching
# ─────────────────────────────────────────────────────────────────────────
use_voltage_loss: True
voltage_loss:
    cell_name_for_sim: ca3_pyramidal
    channel_weight:    0.0          # OFF
    voltage_weight:    1.0
    mask_channels:     True         # voltage-only
    mse_weight:        1.0          # z-scored trace MSE anchor (subthreshold shape)
    efel_weight:       1.0          # soft-eFEL feature matching (smooths the cliff)
    # efel_features unset -> STRONG_FEATURES (time_to_first_spike, mean_frequency,
    #   inv_first_ISI, AHP_depth_abs_slow, ISI_values, AP_amplitude).
    stim_name:         4k50kInterChaoticB
    soma_probe_index:  0
    clamp_unit_tanh:   False         # NO-TANH ablation: unbounded unit output
    t_max_override:    auto          # -> 400 ms from pack meta
    solver:            bwd_euler
    fp64:              True          # requires JAX_ENABLE_X64=true in SLR env.

model:
    myId:    ca3_voltonly_efel_interchaoticB_notanh
    comment: CA3 voltage-only + soft-eFEL, 4k50kInterChaoticB from-scratch, NO tanh clamp
    outputSize_override: 6
    num_cnn_blocks: 2
    conv_block:
        filter: [30, 90, 180]
        kernel: [4,  4,  4]
        pool:   [4,  4,  4]

    instance_norm_slot:  -9
    layer_norm:          False
    batch_norm_cnn_slot: 3
    batch_norm_flat:     True

    fc_block:
       dims:    [512, 512, 512, 256, 128]
       dropFrac: 0.04
