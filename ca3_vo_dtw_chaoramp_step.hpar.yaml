# CA3 Pyramidal — VOLTAGE-ONLY soft-DTW, 2 STIMS: 5kChaoticRamp + 5k0step_500.
#
# The kdr channel is stuck (~r0.44) on chaoticRamp alone because its only signal is a
# non-specific firing rate. A sustained current step (5k0step_500, 0.5 nA, 500 ms) gives
# kdr a clean, specific tonic-firing-rate readout. The 2 stims live on the PROBE axis of
# ca3_chaoramp_step_v1 (num_probs=2); the loss simulates BOTH stims per prediction and
# matches each to its data channel (stim_names_multi order = probe order). PURE soft-DTW
# (no blur — blur regressed on single-stim; the step supplies rate directly).
# STRICTLY VOLTAGE-ONLY: channel_weight 0, mask_channels True -> ion channels never in loss.

data_path:
  perlmutter: /pscratch/sd/k/ktub1999/synthetic_ca3_data/ca3_chaoramp_step_v1/

data_conf:
    serialize_stims:  True     # no-op on count: stims_select=[0]; the 2 stims are PROBES
    append_stim:      False
    parallel_stim:    False
    num_data_workers: 4

max_epochs: 100
batch_size: 128

use_manual_features: False
const_local_batch: True
validation_period: [1, 1]
log_freq_per_epoch: 8
tb_show_graph: False
save_checkpoint: True
resume_checkpoint: False
do_ray: False
model_type: CNN

opt_pytorch:
    amp:       False
    apex:      False
    autotune:  False
    zerograd:  False

train_conf:
    warmup_epochs: 0
    optimizer: [adam, 0.0001]
    LRsched:   { plateau_patience: 10, reduceFactor: 0.3 }
    clip_grad_norm: 1.0

use_voltage_loss: True
voltage_loss:
    cell_name_for_sim: ca3_pyramidal
    channel_weight:    0.0
    voltage_weight:    1.0
    mask_channels:     True
    stim_name:         5kChaoticRamp                      # drives t_max_override:auto -> 500 ms
    stim_names_multi:  [5kChaoticRamp, 5k0step_500]       # MUST match probe/channel order
    soma_probe_index:  0
    clamp_unit_tanh:   True
    range_penalty_weight: 0.0
    t_max_override:    auto
    solver:            bwd_euler
    fp64:              True
    # --- pure soft-DTW, both stims ---
    mse_weight:        0.0
    dtw_weight:        1.0
    dtw_gamma:         0.1
    dtw_n_points:      256
    dtw_band_ms:       8.0
    efel_weight:       0.0
    blur_weight:       0.0
    smooth_sigma:      0.0
    smooth_samples:    1
    lowpass_ms:        0.0

model:
    myId:    ca3_vo_dtw_chaoramp_step
    comment: CA3 voltage-only soft-DTW, 2-stim chaoticRamp + step (kdr rate readout)
    outputSize_override: 6
    num_cnn_blocks: 2
    conv_block:
        filter: [30, 90, 180]
        kernel: [4,  4,  4]
        pool:   [4,  4,  4]
    instance_norm_slot:  -9
    layer_norm:          False
    batch_norm_cnn_slot: 3
    batch_norm_flat:     True
    fc_block:
       dims:    [512, 512, 512, 256, 128]
       dropFrac: 0.04
