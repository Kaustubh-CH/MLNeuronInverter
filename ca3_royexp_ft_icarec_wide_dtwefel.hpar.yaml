# WIDE + DTW + eFEL (2026-08-26): wide_dtw converged cleanly but retreated to
# ~0 spikes (mse_fixed champion, silent); ftwide (MSE+eFEL) fired 4.8 but diverged.
# eFEL = the spike-forcing term, DTW = the stable envelope term -> combine both,
# drop the rigid MSE.
# WIDE-BOX + PURE-DTW (2026-08-26): the ftwide run fires 4.8/1.8 spikes at
# Roy2000/1500 (record) but MSE+eFEL diverges in the wide box (val 3.6->5.5).
# Finding 12: pure soft-DTW is the stable optimizer -> combine all four wins:
# warm-start + icaRec true drive + wide box + DTW loss.
# WIDE-BOX variant (2026-08-26, excitability probe 57638766): log-span 0.5 -> 1.0
# (u=+-1 now spans 10x either way). Probe showed the firing solution sits at
# corner x1.5-2 (outside the 0.5 box): Roy2000_icaRec corner-x1.5 = 30 spikes,
# x2 = 10, vs every in-box model <=2.3. Eval MUST use --physFromModel.
# icaRec twin (2026-08-26, finding 11): identical to its icav2 counterpart except
# every in-loop stim is the EXACT RECORDED rig current Roy<amp>_icaRec_5k
# (holding ~0 nA; icav2 was a constant -0.05 nA low).
# CA3 — VOLTAGE-ONLY fine-tune on Paula's Roy v2 EXPERIMENTAL pack (2026-08-26).
#
# Warm-starts from the best CA3 interchaotic model, ca3_supervised_interchaoticB_k128
# (val 0.0212, mean channel R2 0.918), via the --do_fine_tune flags; the pickled
# module defines the architecture, so the model block below mirrors the k128 design
# only for the from-scratch fallback path.
#
# Pack: /pscratch/sd/k/ktub1999/RoyExpPack_ca3ft/RoyExpChaotic.mlPack1.h5
# (805 exp traces, 44 neurons, splitByNeuron 34/4/6, 4001 bins fixed-norm,
#  labels = 6-wide dummy with stim-family index in col 0).  Launch with
# NEUINV_CELL=RoyExpChaotic / --cellName RoyExpChaotic.
#
# Per-sample stimulus: voltage_loss.stim_from_label groups each batch by the
# label col-0 family index and simulates with that family's rig-accurate CSV
# (Roy<amp>_icaRec_5k = v2 holding -0.0496 nA + fitted slope x 5k50kInterChaoticB).
# stim_name only anchors t_max_override:auto (all 5 CSVs are 5000 pts -> 500 ms).
# sim_t_skip_ms 99.9 (999 bins) aligns the post-skip sim window with the pack's
# 1-bin lead-padded 4001-bin recording window exactly.

data_path:
  perlmutter: /pscratch/sd/k/ktub1999/RoyExpPack_ca3ft/

data_conf:
    serialize_stims:  True
    append_stim:      False
    parallel_stim:    False
    num_data_workers: 4

max_epochs: 40
batch_size: 16          # valid split is 80 -> 20/rank on 4 GPUs; 32 would give 0 steps

use_manual_features: False

const_local_batch: True
validation_period: [1, 1]

log_freq_per_epoch: 8
tb_show_graph: False

save_checkpoint: True
resume_checkpoint: False   # warm-start is via --do_fine_tune, NOT resume

do_ray: False
model_type: CNN

opt_pytorch:
    amp:       False
    apex:      False
    autotune:  False
    zerograd:  False

train_conf:
    warmup_epochs: 0
    optimizer: [adam, 0.00005]    # fine-tune LR (overridable via --initLR)
    LRsched:   { plateau_patience: 10, reduceFactor: 0.3 }
    clip_grad_norm: 1.0

# ─────────────────────────────────────────────────────────────────────────
# VOLTAGE-ONLY loss (no channel supervision) + soft-eFEL feature matching
# ─────────────────────────────────────────────────────────────────────────
use_voltage_loss: True
voltage_loss:
    cell_name_for_sim: ca3_pyramidal
    channel_weight:    0.0          # OFF (exp pack has no ground-truth params)
    voltage_weight:    1.0
    mask_channels:     True         # voltage-only
    mse_weight:        0.0
    efel_weight:       1.0
    dtw_weight:        1.0
    dtw_gamma:         0.1
    dtw_n_points:      256
    dtw_band_ms:       8.0
    stim_name:         Roy2000_icaRec_5k     # t_max anchor only; see stim_from_label
    stim_from_label:
        label_col:  0
        stim_names: [Roy100_icaRec_5k, Roy500_icaRec_5k, Roy1000_icaRec_5k,
                     Roy1500_icaRec_5k, Roy2000_icaRec_5k]
    soma_probe_index:  0
    sim_t_skip_ms:     99.9         # 999 bins: sim bin i == 5k-stim bin 999+i == data bin i
    clamp_unit_tanh:   True
    t_max_override:    auto          # -> 500 ms from the 5000-pt stim CSV
    solver:            bwd_euler
    fp64:              True
    # CA3 unit->phys mapping, verbatim from the k128 sum_train.yaml input_meta
    # (yaml wins over the pack's meta copy).
    phys_par_range:
        - [3.9417e-05, 1.0, "S/cm^2"]   # CA3_g_leak
        - [0.04,       1.0, "S/cm^2"]   # CA3_gbar_na3
        - [0.01,       1.0, "S/cm^2"]   # CA3_gkdrbar_kdr
        - [0.04,       1.0, "S/cm^2"]   # CA3_gkabar_kap
        - [0.00052,    1.0, "S/cm^2"]   # CA3_gbar_km
        - [0.00025,    1.0, "S/cm^2"]   # CA3_gkdbar_kd

model:
    myId:    ca3_royexp_ft_icarec_wide_dtwefel
    comment: CA3 voltage-only+soft-eFEL fine-tune of interchaoticB_k128 on Roy exp v2 pack
    outputSize_override: 6
    num_cnn_blocks: 2
    conv_block:
        filter: [30, 90, 180]
        kernel: [128, 128, 128]
        pool:   [4,  4,  4]

    instance_norm_slot:  -9
    layer_norm:          False
    batch_norm_cnn_slot: 3
    batch_norm_flat:     True

    fc_block:
       dims:    [512, 512, 512, 256, 128]
       dropFrac: 0.04
