# Phase 4 (multi-stim): CA3 Pyramidal, 4-stim JOINT-channel data + hybrid loss.
#
# Same cell/params as ca3_matched.hpar.yaml, but every sample is the SAME 6-param
# CA3 cell simulated under 4 stimuli, stacked on the PROBE axis (num_probs=4):
#
#   channel 0 : 5k50kInterChaoticB   (chaotic)
#   channel 1 : 5k0step_500          (step)
#   channel 2 : 5k0chirp             (chirp)
#   channel 3 : 5k0ramp              (ramp)
#
# Data generated by scripts/gen_ca3_sharded.py --stims <the 4 above>.  The CNN
# sees all 4 traces as input channels (probsSelect 0 1 2 3); HybridLoss re-sims
# pred_phys under each stim (stim_names_multi) and supervises data channel i.
#
# Fixed-scale normalization uses the SAME jaxley_utils constants as the loss, so
# data and sim live in one voltage space (self-consistent).

data_path:
  perlmutter: /pscratch/sd/k/ktub1999/synthetic_ca3_data/ca3_multistim_v1/

data_conf:
    # serialize_stims:True is what collapses the PROBE axis (4 stim channels)
    # into CNN input channels -> inputShape (T, 4).  num_stims=1 in the pack, so
    # this does NOT multiply samples (locSamp *= numStim == 1); it just reshapes,
    # exactly as the proven single-stim ca3_matched config does.
    serialize_stims:  True
    append_stim:      False
    parallel_stim:    False
    num_data_workers: 4

max_epochs: 100
batch_size: 128

use_manual_features: False

const_local_batch: True
validation_period: [1, 1]

log_freq_per_epoch: 8
tb_show_graph: False

save_checkpoint: True
resume_checkpoint: False

do_ray: False
model_type: CNN

opt_pytorch:
    amp:       False
    apex:      False
    autotune:  False
    zerograd:  False

train_conf:
    warmup_epochs: 0
    optimizer: [adam, 0.0003]
    LRsched:   { plateau_patience: 10, reduceFactor: 0.3 }
    clip_grad_norm: 1.0

# ─────────────────────────────────────────────────────────────────────────
# Hybrid (channel + voltage) loss — multi-stim variant
# ─────────────────────────────────────────────────────────────────────────
use_voltage_loss: True
voltage_loss:
    cell_name_for_sim: ca3_pyramidal
    channel_weight:    1.0
    voltage_weight:    1.0
    mask_channels:     False
    # stim_name drives t_max_override:auto (all 4 stims are 5000 samples @0.1ms).
    stim_name:         5k50kInterChaoticB
    # stim_names_multi -> HybridLoss "Exp 3" path: sim EACH stim, soma trace,
    # compared against data probe channel i (SAME order as the data's probe axis
    # and probsSelect 0 1 2 3).
    stim_names_multi:  [5k50kInterChaoticB, 5k0step_500, 5k0chirp, 5k0ramp]
    soma_probe_index:  0
    clamp_unit_tanh:   True
    t_max_override:    auto
    solver:            bwd_euler
    fp64:              True         # REQUIRED under DDP (see ca3_matched.hpar.yaml)

model:
    myId:    ca3_multistim
    comment: Phase 4 CA3 Pyramidal 4-stim joint-channel synth data + sim
    outputSize_override: 6
    num_cnn_blocks: 2
    conv_block:
        filter: [30, 90, 180]
        kernel: [4,  4,  4]
        pool:   [4,  4,  4]

    instance_norm_slot:  -9
    layer_norm:          False
    batch_norm_cnn_slot: 3
    batch_norm_flat:     True

    fc_block:
       dims:    [512, 512, 512, 256, 128]
       dropFrac: 0.04
