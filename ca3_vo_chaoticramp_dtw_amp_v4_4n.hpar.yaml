# CA3 Pyramidal — VOLTAGE-ONLY soft-DTW (primary) + SMALL ramped soft-eFEL aux
# (voltage_base + AP_amplitude), at 400k DATA. Stacks the two best levers of the campaign:
#   - dtw_amp_200k (DTW + this eFEL aux, 200k) = mean R2 0.763  <- current BEST recipe
#   - dtw_400k     (pure DTW, 400k)            = mean R2 0.736  <- most data
# Clone of ca3_vo_chaoticramp_dtw_amp_8n.hpar.yaml; ONLY changes: data_path -> v4 400k pack
# and batch_size 64 -> 128 (for a 4-NODE / 16-GPU run -> SAME global batch 2048 as the whole
# sweep; 4 nodes schedule far faster than 8, and 8n gave NO speedup at fixed global batch).
#
# The eFEL aux was the biggest single-lever win (na3 0.79->0.87 via AP_amplitude; kdr
# 0.338->0.366, best of campaign) and it beat 400k DATA with HALF the data -> this run asks
# whether the two levers ADD. efel_weight ramps 0.05 -> 0.2 over 20 epochs (DTW locks timing
# first so the soft-eFEL gradient stays tame; efel@1.0 diverges, a small ramped aux wins).
# STRICTLY voltage-only (channel_weight 0, mask_channels True; features are trace-only).

data_path:
  perlmutter: /pscratch/sd/k/ktub1999/synthetic_ca3_data/ca3_chaoticramp_v4/

data_conf:
    serialize_stims:  True
    append_stim:      False
    parallel_stim:    False
    num_data_workers: 4

max_epochs: 100
batch_size: 128

use_manual_features: False
const_local_batch: True
validation_period: [1, 1]
log_freq_per_epoch: 8
tb_show_graph: False
save_checkpoint: True
resume_checkpoint: False
do_ray: False
model_type: CNN

opt_pytorch:
    amp:       False
    apex:      False
    autotune:  False
    zerograd:  False

train_conf:
    warmup_epochs: 0
    optimizer: [adam, 0.0001]
    LRsched:   { plateau_patience: 10, reduceFactor: 0.3 }
    clip_grad_norm: 1.0

use_voltage_loss: True
voltage_loss:
    cell_name_for_sim: ca3_pyramidal
    channel_weight:    0.0
    voltage_weight:    1.0
    mask_channels:     True
    stim_name:         5kChaoticRamp
    soma_probe_index:  0
    clamp_unit_tanh:   True
    range_penalty_weight: 0.0
    t_max_override:    auto
    solver:            bwd_euler
    fp64:              True
    # PRIMARY = soft-DTW (timing). AUX = 2 soft-eFEL features (level/amplitude).
    mse_weight:        0.0
    dtw_weight:        1.0
    dtw_gamma:         0.1
    dtw_n_points:      256
    dtw_band_ms:       8.0
    blur_weight:       0.0
    smooth_sigma:      0.0
    smooth_samples:    1
    lowpass_ms:        0.0
    # --- differentiable resting-potential + AP-amplitude anchor (voltage-only) ---
    efel_weight:       0.2
    efel_features:     [voltage_base, AP_amplitude]
    schedule:
        # ramp UP: tiny early (DTW locks timing, avoids soft-eFEL blow-up), grows to 0.2
        efel_weight:  { start: 0.05, end: 0.2, epochs: 20 }

model:
    myId:    ca3_vo_chaoticramp_dtw_amp_v4_4n
    comment: CA3 voltage-only soft-DTW + soft-eFEL(voltage_base,AP_amplitude) aux, 400k, 4-node global-batch-2048
    outputSize_override: 6
    num_cnn_blocks: 2
    conv_block:
        filter: [30, 90, 180]
        kernel: [4,  4,  4]
        pool:   [4,  4,  4]
    instance_norm_slot:  -9
    layer_norm:          False
    batch_norm_cnn_slot: 3
    batch_norm_flat:     True
    fc_block:
       dims:    [512, 512, 512, 256, 128]
       dropFrac: 0.04
