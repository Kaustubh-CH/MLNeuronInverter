# MODEL LADDER (ball_and_stick_bbp, 5k50kInterChaoticB, voltage-only soft-DTW + eFEL aux).
# Generated by scripts/make_ladder_designs.py -- see docs/model_ladder/README.md.
# Pack: /global/homes/k/ktub1999/model_ladder_data/ball_and_stick_bbp_5k50kInterChaoticB/ball_and_stick_bbp_synth.mlPack1.h5 (stim scaled by the cell module's _STIM_SCALE, recorded in meta).
# 1 data probe(s); voltage loss uses the soma (probe 0).

data_path:
  perlmutter: /global/homes/k/ktub1999/model_ladder_data/ball_and_stick_bbp_5k50kInterChaoticB/

data_conf:
    serialize_stims:  True
    append_stim:      False
    parallel_stim:    False
    num_data_workers: 4

max_epochs: 100
batch_size: 128

use_manual_features: False
const_local_batch: True
validation_period: [1, 1]
log_freq_per_epoch: 8
tb_show_graph: False
save_checkpoint: True
resume_checkpoint: False
do_ray: False
model_type: CNN

opt_pytorch:
    amp:       False
    apex:      False
    autotune:  False
    zerograd:  False

train_conf:
    warmup_epochs: 0
    optimizer: [adam, 0.0001]
    LRsched:   { plateau_patience: 10, reduceFactor: 0.3 }
    clip_grad_norm: 1.0

use_voltage_loss: True
voltage_loss:
    cell_name_for_sim: ball_and_stick_bbp
    channel_weight:    0.0
    voltage_weight:    1.0
    mask_channels:     True          # STRICTLY voltage-only: labels never enter the loss
    stim_name:         5k50kInterChaoticB
    soma_probe_index:  0
    clamp_unit_tanh:   True
    range_penalty_weight: 0.0
    t_max_override:    auto
    solver:            bwd_euler
    fp64:              True
    # PRIMARY = soft-DTW (timing); AUX = 2 soft-eFEL features (level/amplitude), ramped.
    mse_weight:        0.0
    dtw_weight:        1.0
    dtw_gamma:         0.1
    dtw_n_points:      256
    dtw_band_ms:       8.0
    blur_weight:       0.0
    smooth_sigma:      0.0
    smooth_samples:    1
    lowpass_ms:        0.0
    efel_weight:       0.2
    efel_features:     [voltage_base, AP_amplitude]
    schedule:
        efel_weight:  { start: 0.05, end: 0.2, epochs: 20 }

model:
    myId:    ladder_ball_and_stick_bbp_icb_vo
    comment: model ladder ball_and_stick_bbp 5k50kInterChaoticB vo
    outputSize_override: 13
    num_cnn_blocks: 2
    conv_block:
        filter: [30, 90, 180]
        kernel: [4,  4,  4]
        pool:   [4,  4,  4]
    instance_norm_slot:  -9
    layer_norm:          False
    batch_norm_cnn_slot: 3
    batch_norm_flat:     True
    fc_block:
       dims:    [512, 512, 512, 256, 128]
       dropFrac: 0.04
