# CA3 voltage-only, BLUR-MSE ONLY (multi-scale van-Rossum blurred MSE), interchaoticB.
# NO plain MSE (mse_weight 0), NO features, NO ion-channel error (mask_channels True).
data_path:
  perlmutter: /pscratch/sd/k/ktub1999/synthetic_ca3_data/ca3_4kinterchaoticB_v1/
data_conf: { serialize_stims: True, append_stim: False, parallel_stim: False, num_data_workers: 4 }
max_epochs: 100
batch_size: 128
use_manual_features: False
const_local_batch: True
validation_period: [1, 1]
log_freq_per_epoch: 8
tb_show_graph: False
save_checkpoint: True
resume_checkpoint: False
do_ray: False
model_type: CNN
opt_pytorch: { amp: False, apex: False, autotune: False, zerograd: False }
train_conf:
    warmup_epochs: 0
    optimizer: [adam, 0.0001]
    LRsched: { plateau_patience: 10, reduceFactor: 0.3 }
    clip_grad_norm: 1.0
use_voltage_loss: True
voltage_loss:
    cell_name_for_sim: ca3_pyramidal
    channel_weight:    0.0
    voltage_weight:    1.0
    mask_channels:     True
    stim_name:         4k50kInterChaoticB
    soma_probe_index:  0
    clamp_unit_tanh:   True
    t_max_override:    auto
    solver:            bwd_euler
    fp64:              True
    mse_weight:        0.0          # NO plain MSE
    blur_weight:       1.0          # multi-scale blurred (van-Rossum) MSE == "blur MSE"
    efel_weight:       0.0
    dtw_weight:        0.0
    lowpass_ms:        0.0
    smooth_sigma:      0.0
    range_penalty_weight: 0.0
model:
    myId:    ca3_vo_blur_interchaoticB
    comment: voltage-only, blur-MSE only, interchaoticB
    outputSize_override: 6
    num_cnn_blocks: 2
    conv_block: { filter: [30, 90, 180], kernel: [4, 4, 4], pool: [4, 4, 4] }
    instance_norm_slot:  -9
    layer_norm:          False
    batch_norm_cnn_slot: 3
    batch_norm_flat:     True
    fc_block: { dims: [512, 512, 512, 256, 128], dropFrac: 0.04 }
