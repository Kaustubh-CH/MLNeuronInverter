# CA3 Pyramidal — VOLTAGE-ONLY soft-DTW with NARROWER warp band, 5kChaoticRamp.
#
# Arm B. Baseline soft-DTW (ca3_vo_chaoticramp_dtw) with dtw_band_ms 8 -> 4; the ONLY
# changed variable. Motivation: kdr's signal is firing rate / ISI structure, and its
# poor recovery (0.155) is a specificity problem. An 8 ms Sakoe-Chiba band forgives up
# to 8 ms of spike jitter, which may discard the fine ISI/rate differences that pin
# kdr. Halving the band to 4 ms tightens the timing penalty (more ISI fidelity) while
# keeping enough warp tolerance to avoid the raw-MSE cliff (which sends na3 to -0.9).
# STRICTLY VOLTAGE-ONLY (channel_weight 0, mask_channels True).

data_path:
  perlmutter: /pscratch/sd/k/ktub1999/synthetic_ca3_data/ca3_chaoticramp_v1/

data_conf:
    serialize_stims:  True
    append_stim:      False
    parallel_stim:    False
    num_data_workers: 4

max_epochs: 100
batch_size: 128

use_manual_features: False
const_local_batch: True
validation_period: [1, 1]
log_freq_per_epoch: 8
tb_show_graph: False
save_checkpoint: True
resume_checkpoint: False
do_ray: False
model_type: CNN

opt_pytorch:
    amp:       False
    apex:      False
    autotune:  False
    zerograd:  False

train_conf:
    warmup_epochs: 0
    optimizer: [adam, 0.0001]
    LRsched:   { plateau_patience: 10, reduceFactor: 0.3 }
    clip_grad_norm: 1.0

use_voltage_loss: True
voltage_loss:
    cell_name_for_sim: ca3_pyramidal
    channel_weight:    0.0
    voltage_weight:    1.0
    mask_channels:     True
    stim_name:         5kChaoticRamp
    soma_probe_index:  0
    clamp_unit_tanh:   True
    range_penalty_weight: 0.0
    t_max_override:    auto
    solver:            bwd_euler
    fp64:              True
    # --- pure soft-DTW, band narrowed 8 -> 4 ms (the only change vs baseline) ---
    mse_weight:        0.0
    dtw_weight:        1.0
    dtw_gamma:         0.1
    dtw_n_points:      256
    dtw_band_ms:       4.0
    efel_weight:       0.0
    blur_weight:       0.0
    smooth_sigma:      0.0
    smooth_samples:    1
    lowpass_ms:        0.0

model:
    myId:    ca3_vo_dtw_band4_chaoticramp
    comment: CA3 voltage-only soft-DTW, narrower 4ms warp band, 5kChaoticRamp
    outputSize_override: 6
    num_cnn_blocks: 2
    conv_block:
        filter: [30, 90, 180]
        kernel: [4,  4,  4]
        pool:   [4,  4,  4]
    instance_norm_slot:  -9
    layer_norm:          False
    batch_norm_cnn_slot: 3
    batch_norm_flat:     True
    fc_block:
       dims:    [512, 512, 512, 256, 128]
       dropFrac: 0.04
