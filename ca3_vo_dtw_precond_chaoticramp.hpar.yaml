# CA3 Pyramidal — VOLTAGE-ONLY soft-DTW + grad-PRECONDITIONER, 5kChaoticRamp.
#
# Arm A. Baseline soft-DTW (ca3_vo_chaoticramp_dtw) UNCHANGED, plus a per-channel
# gradient preconditioner. The only changed variable vs the baseline is grad_precond.
# Motivation: the voltage sensitivity ||dV_z/dtheta|| is ~uniform across channels
# ([leak 6.45, na3 3.81, kdr 4.54, kap 4.84, km 6.35, kd 5.87]) so kdr is NOT
# voltage-gradient-starved; but in soft-eFEL FEATURE space kdr is dramatically the
# weakest column (feature-max S: kdr 3.01 vs 7.8-16.8 for the rest) — its only handle
# is a non-specific mean_frequency. We use the FEATURE-space sensitivity to up-weight
# kdr's (weak, non-specific) gradient so the CNN attends to it. w_p = s_p^-0.5,
# geomean-normalized -> w = [leak .90, na3 .97, kdr 1.68, kap .93, km 1.04, kd .71].
# grad_precond only rescales dL_voltage/dtheta columns; it NEVER adds an ion-channel
# term. STRICTLY VOLTAGE-ONLY (channel_weight 0, mask_channels True).

data_path:
  perlmutter: /pscratch/sd/k/ktub1999/synthetic_ca3_data/ca3_chaoticramp_v1/

data_conf:
    serialize_stims:  True
    append_stim:      False
    parallel_stim:    False
    num_data_workers: 4

max_epochs: 100
batch_size: 128

use_manual_features: False
const_local_batch: True
validation_period: [1, 1]
log_freq_per_epoch: 8
tb_show_graph: False
save_checkpoint: True
resume_checkpoint: False
do_ray: False
model_type: CNN

opt_pytorch:
    amp:       False
    apex:      False
    autotune:  False
    zerograd:  False

train_conf:
    warmup_epochs: 0
    optimizer: [adam, 0.0001]
    LRsched:   { plateau_patience: 10, reduceFactor: 0.3 }
    clip_grad_norm: 1.0

use_voltage_loss: True
voltage_loss:
    cell_name_for_sim: ca3_pyramidal
    channel_weight:    0.0
    voltage_weight:    1.0
    mask_channels:     True
    stim_name:         5kChaoticRamp
    soma_probe_index:  0
    clamp_unit_tanh:   True
    range_penalty_weight: 0.0
    t_max_override:    auto
    solver:            bwd_euler
    fp64:              True
    # --- pure soft-DTW, IDENTICAL to the baseline ---
    mse_weight:        0.0
    dtw_weight:        1.0
    dtw_gamma:         0.1
    dtw_n_points:      256
    dtw_band_ms:       8.0
    efel_weight:       0.0
    blur_weight:       0.0
    smooth_sigma:      0.0
    smooth_samples:    1
    lowpass_ms:        0.0
    # --- grad preconditioner: up-weight kdr's (feature-weak) gradient column ---
    grad_precond:
        # feature-max sensitivity on 5kChaoticRamp, CA3 order [leak,na3,kdr,kap,km,kd]
        sensitivity: [10.4721, 9.0886, 3.0083, 9.7817, 7.8189, 16.7885]
        exponent:    0.5
        normalize:   geomean
        enabled:     True

model:
    myId:    ca3_vo_dtw_precond_chaoticramp
    comment: CA3 voltage-only soft-DTW + feature-sensitivity grad-precond, 5kChaoticRamp
    outputSize_override: 6
    num_cnn_blocks: 2
    conv_block:
        filter: [30, 90, 180]
        kernel: [4,  4,  4]
        pool:   [4,  4,  4]
    instance_norm_slot:  -9
    layer_norm:          False
    batch_norm_cnn_slot: 3
    batch_norm_flat:     True
    fc_block:
       dims:    [512, 512, 512, 256, 128]
       dropFrac: 0.04
