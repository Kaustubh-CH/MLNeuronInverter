# CA3 Pyramidal — VOLTAGE-ONLY loss (single-stim). Fresh from scratch.
#
# Same cell/data/model as ca3_matched.hpar.yaml, but the loss is voltage-trace
# ONLY: mask_channels:True drops the parameter (channel) supervision entirely, so
# the CNN is trained purely by matching the jaxley-simulated soma voltage of its
# predicted params to the true soma voltage.
#   loss = voltage_weight * MSE( z(sim(pred_phys)), z(true_volts) )
# clamp_unit_tanh:True bounds predictions to the physical range so jaxley stays
# numerically stable without the channel anchor.

data_path:
  perlmutter: /pscratch/sd/k/ktub1999/synthetic_ca3_data/ca3_synth_v3/

data_conf:
    serialize_stims:  True
    append_stim:      False
    parallel_stim:    False
    num_data_workers: 4

max_epochs: 100
batch_size: 128

use_manual_features: False

const_local_batch: True
validation_period: [1, 1]

log_freq_per_epoch: 8
tb_show_graph: False

save_checkpoint: True
resume_checkpoint: False

do_ray: False
model_type: CNN

opt_pytorch:
    amp:       False
    apex:      False
    autotune:  False
    zerograd:  False

train_conf:
    warmup_epochs: 0
    optimizer: [adam, 0.0003]
    LRsched:   { plateau_patience: 10, reduceFactor: 0.3 }
    clip_grad_norm: 1.0

# ─────────────────────────────────────────────────────────────────────────
# VOLTAGE-ONLY loss (no channel/parameter supervision)
# ─────────────────────────────────────────────────────────────────────────
use_voltage_loss: True
voltage_loss:
    cell_name_for_sim: ca3_pyramidal
    channel_weight:    0.0          # OFF
    voltage_weight:    1.0
    mask_channels:     True         # skip the parameter term entirely -> voltage-only
    stim_name:         5k50kInterChaoticB
    soma_probe_index:  0
    clamp_unit_tanh:   True
    t_max_override:    auto
    solver:            bwd_euler
    fp64:              True         # requires JAX_ENABLE_X64=true in SLR env.

model:
    myId:    ca3_voltonly
    comment: CA3 Pyramidal voltage-only (mask_channels) single-stim
    outputSize_override: 6
    num_cnn_blocks: 2
    conv_block:
        filter: [30, 90, 180]
        kernel: [4,  4,  4]
        pool:   [4,  4,  4]

    instance_norm_slot:  -9
    layer_norm:          False
    batch_norm_cnn_slot: 3
    batch_norm_flat:     True

    fc_block:
       dims:    [512, 512, 512, 256, 128]
       dropFrac: 0.04
