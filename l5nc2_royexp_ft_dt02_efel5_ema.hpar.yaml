# L5 nc2 — VOLTAGE-ONLY fine-tune of the fp32/dt0.2 pilot on Paula's Roy v2 EXPERIMENTAL pack
# (2026-09-09).  Recipe = the CA3 exp champion `ca3_royexp_ft_icarec_wide_dtwefel5_ema` (soft-DTW 1
# + soft-eFEL x5 on the rate-dominated STRONG_FEATURES + per-family EMA loss balance), applied to the
# 19-parameter L5 model.
#
# Warm start: the pilot `ladder_l5ttpc_nc2_icb4k_vo_fp32dt02` (test R2 -0.88, but it is the trained
# dt-0.2 CNN) via NEUINV_FT_MODEL / NEUINV_FT_CKPT (--do_fine_tune).  The pickled module defines the
# architecture; the model block below mirrors it only for the from-scratch fallback.
#
# Pack: /pscratch/sd/k/ktub1999/RoyExpPack_l5dt02/RoyExpChaotic.mlPack1.h5 = the ca3ft exp pack with
# volts_norm decimated to the 0.2 ms grid (2001 bins) so the dt-0.2 CNN input matches; 805 traces,
# 44 neurons, splitByNeuron; labels = 6-wide dummy with the stim-family index in col 0.
# Launch with NEUINV_CELL=RoyExpChaotic, NEUINV_PROBS="0" (probe 1 is the stimulus channel).
#
# Physics: solver dt 0.2 (sim_dt_override = the pack grid -> no decimation), stim_scale 1.0 = the
# REAL recorded current (Roy<amp>_icaRec_5k; the module's 1.5 is a synthetic-training device),
# 500 ms window (2500 steps -> checkpoint_lengths [251, 10]); fp32 solve; sim_t_skip_ms 99.8: sim bin 499+j
# (t = 99.8 + 0.2 j) == decimated data bin j (lead pad, then recording samples 1,3,5,.. at
# t = 0.1 + 0.2 (j-1)) to within 0.1 ms.  fp64 solve (JAX_ENABLE_X64 true in the job env).

data_path:
  perlmutter: /pscratch/sd/k/ktub1999/RoyExpPack_l5dt02/

data_conf:
    serialize_stims:  True
    append_stim:      False
    parallel_stim:    False
    num_data_workers: 4

max_epochs: 40          # interactive run uses NEUINV_EPOCHS=16; the sbatch twin 40
batch_size: 16          # valid split is 80 -> 20/rank on 4 GPUs; 32 would give 0 steps

use_manual_features: False

const_local_batch: True
validation_period: [1, 1]

log_freq_per_epoch: 8
tb_show_graph: False

save_checkpoint: True
resume_checkpoint: False   # warm-start is via --do_fine_tune, NOT resume

do_ray: False
model_type: CNN

opt_pytorch:
    amp:       False
    apex:      False
    autotune:  False
    zerograd:  False

train_conf:
    warmup_epochs: 0
    optimizer: [adam, 0.00005]    # fine-tune LR (overridable via NEUINV_INITLR)
    LRsched:   { plateau_patience: 10, reduceFactor: 0.3 }
    clip_grad_norm: 1.0

use_voltage_loss: True
voltage_loss:
    cell_name_for_sim: l5ttpc
    channel_weight:    0.0          # OFF (exp pack has no ground-truth params)
    voltage_weight:    1.0
    mask_channels:     True         # voltage-only
    mse_weight:        0.0
    efel_weight:       5.0
    dtw_weight:        1.0
    dtw_gamma:         0.1
    dtw_n_points:      256
    dtw_band_ms:       8.0
    # NB the CA3 champion declared pooled_stim_norm: ema, but on the stim_from_label path
    # that switch is a no-op (EMA lives in the pooled_stim_names branch); groups are
    # size-weighted, i.e. a plain per-sample mean.  Left out here on purpose.
    stim_name:         Roy2000_icaRec_5k     # t_max anchor only; see stim_from_label
    stim_from_label:
        label_col:  0
        stim_names: [Roy100_icaRec_5k, Roy500_icaRec_5k, Roy1000_icaRec_5k,
                     Roy1500_icaRec_5k, Roy2000_icaRec_5k]
        pad_group:  8               # ~3 traces/family in a 16-batch -> pad to 8, not 16
    stim_scale:        1.0          # real injected current, NOT the module's synthetic 1.5
    soma_probe_index:  0
    sim_t_skip_ms:     99.8         # 499 bins on the 0.2 ms grid (see header)
    sim_dt_override:   0.2
    checkpoint_lengths: [251, 10]   # 2500 steps + 1
    clamp_unit_tanh:   True
    t_max_override:    auto         # -> 500 ms from the 5000-pt stim CSV
    solver:            bwd_euler
    fp64:              False        # fp32 solve (validated stable for L5 nc2 in the pilot);
                                    # job env: NEUINV_JAX_X64=false
    # 19-par L5 unit->phys mapping, verbatim from the pilot's sum_train.yaml input_meta
    # (yaml wins over the exp pack's 6-par CA3 meta copy).  "lin" rows = linear (run.py) map.
    phys_par_range:
        - [0.026145, 1.0, S/cm^2]   # gNaTs2_tbar_NaTs2_t_apical
        - [0.004226, 1.0, S/cm^2]   # gSKv3_1bar_SKv3_1_apical
        - [0.000143, 1.0, S/cm^2]   # gImbar_Im_apical
        - [8e-05, 1.0, S/cm^2]   # gIhbar_Ih_dend
        - [3.137968, 1.0, S/cm^2]   # gNaTa_tbar_NaTa_t_axonal
        - [0.089259, 1.0, S/cm^2]   # gK_Tstbar_K_Tst_axonal
        - [0.006827, 1.0, S/cm^2]   # gNap_Et2bar_Nap_Et2_axonal
        - [0.007104, 1.0, S/cm^2]   # gSK_E2bar_SK_E2_axonal
        - [0.00099, 1.0, S/cm^2]   # gCa_HVAbar_Ca_HVA_axonal
        - [0.973538, 1.0, S/cm^2]   # gK_Pstbar_K_Pst_axonal
        - [0.008752, 1.0, S/cm^2]   # gCa_LVAstbar_Ca_LVAst_axonal
        - [3e-05, 1.0, S/cm^2]   # g_pas_axonal
        - [1.25, 0.75, uF/cm^2, lin]   # cm_axonal
        - [0.303472, 1.0, S/cm^2]   # gSKv3_1bar_SKv3_1_somatic
        - [0.983955, 1.0, S/cm^2]   # gNaTs2_tbar_NaTs2_t_somatic
        - [0.000333, 1.0, S/cm^2]   # gCa_LVAstbar_Ca_LVAst_somatic
        - [3e-05, 1.0, S/cm^2]   # g_pas_somatic
        - [1.25, 0.75, uF/cm^2, lin]   # cm_somatic
        - [-75.0, 10.0, mV, lin]   # e_pas_all

model:
    myId:    l5nc2_royexp_ft_dt02_efel5_ema
    comment: L5 nc2 fp32/dt0.2 pilot fine-tuned voltage-only on Roy v2 exp pack (efel5-ema recipe)
    outputSize_override: 19          # exp pack labels are a 6-wide dummy; the CNN emits 19
    num_cnn_blocks: 2
    conv_block:
        filter: [30, 90, 180]
        kernel: [4,  4,  4]
        pool:   [4,  4,  4]
    instance_norm_slot:  -9
    layer_norm:          False
    batch_norm_cnn_slot: 3
    batch_norm_flat:     True
    fc_block:
       dims:    [512, 512, 512, 256, 128]
       dropFrac: 0.04
