# CA3 Pyramidal — SUPERVISED parameter regression on the Step1000 pack.
#
# Supervised param-MSE recipe (use_voltage_loss:False -> Trainer uses plain
# torch.nn.MSELoss on the ground-truth unit conductances). Reuses the EXISTING
# ca3_best_mse_step1000 pack (BBP_Exp_Step1000_i4k stim, 4001-long soma traces,
# 6 conductances) — no regeneration needed.
#
# NEW (2026-07-10): clamp_unit_tanh below now ALSO applies in the supervised
# path. When True, Trainer squashes the CNN output through tanh -> (-1,1) before
# the param-MSE, so predictions stay bounded/physical on out-of-distribution
# (experimental) inputs instead of extrapolating to extreme unit values.
# Set it False to recover the classic unbounded supervised behaviour.

data_path:
  perlmutter: /pscratch/sd/k/ktub1999/synthetic_ca3_data/ca3_best_mse_step1000/

data_conf:
    serialize_stims:  True
    append_stim:      False
    parallel_stim:    False
    num_data_workers: 4

max_epochs: 200
batch_size: 128

use_manual_features: False

const_local_batch: True
validation_period: [1, 1]

log_freq_per_epoch: 8
tb_show_graph: False

save_checkpoint: True
resume_checkpoint: False

do_ray: False
model_type: CNN

opt_pytorch:
    amp:       False
    apex:      False
    autotune:  False
    zerograd:  False

train_conf:
    warmup_epochs: 0
    optimizer: [adam, 0.0003]      # param-MSE is stable; no eFEL divergence concern
    LRsched:   { plateau_patience: 10, reduceFactor: 0.3 }
    clip_grad_norm: 0

# ─────────────────────────────────────────────────────────────────────────
# SUPERVISED: pure param-MSE (no voltage term). The voltage_loss block below
# feeds evaluate_voltage.py's re-simulation for the trace overlay / spike
# metrics AND (new) supplies clamp_unit_tanh to the supervised training path.
# ─────────────────────────────────────────────────────────────────────────
use_voltage_loss: False
voltage_loss:
    cell_name_for_sim: ca3_pyramidal
    channel_weight:    1.0
    voltage_weight:    0.0
    mask_channels:     False
    stim_name:         BBP_Exp_Step1000_i4k
    soma_probe_index:  0
    clamp_unit_tanh:   True         # bound supervised outputs to (-1,1); set False for unbounded
    t_max_override:    auto
    solver:            bwd_euler
    fp64:              True

model:
    myId:    ca3_supervised_step1000
    comment: CA3 supervised param-MSE, BBP_Exp_Step1000_i4k pack, tanh-bounded, 200ep
    outputSize_override: 6
    num_cnn_blocks: 2
    conv_block:
        filter: [30, 90, 180]
        kernel: [4,  4,  4]
        pool:   [4,  4,  4]

    instance_norm_slot:  -9
    layer_norm:          False
    batch_norm_cnn_slot: 3
    batch_norm_flat:     True

    fc_block:
       dims:    [512, 512, 512, 256, 128]
       dropFrac: 0.04
