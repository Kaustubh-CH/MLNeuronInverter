# CA3 voltage-only, ALL 22 combined soft features (eFEL + dV/dt + K-handles + subthreshold), chaoticRamp.
# NO plain MSE (mse_weight 0), NO ion-channel error (mask_channels True). Debug queue 8 nodes / 30 min.
data_path:
  perlmutter: /pscratch/sd/k/ktub1999/synthetic_ca3_data/ca3_chaoticramp_v1/
data_conf: { serialize_stims: True, append_stim: False, parallel_stim: False, num_data_workers: 4 }
max_epochs: 100
batch_size: 64
use_manual_features: False
const_local_batch: True
validation_period: [1, 1]
log_freq_per_epoch: 8
tb_show_graph: False
save_checkpoint: True
resume_checkpoint: False
do_ray: False
model_type: CNN
opt_pytorch: { amp: False, apex: False, autotune: False, zerograd: False }
train_conf:
    warmup_epochs: 0
    optimizer: [adam, 0.00005]   # lowered from 1e-4: feature loss diverges (a7_hybrid lesson)
    LRsched: { plateau_patience: 10, reduceFactor: 0.3 }
    clip_grad_norm: 1.0
use_voltage_loss: True
voltage_loss:
    cell_name_for_sim: ca3_pyramidal
    channel_weight:    0.0
    voltage_weight:    1.0
    mask_channels:     True
    stim_name:         5kChaoticRamp
    soma_probe_index:  0
    clamp_unit_tanh:   True
    t_max_override:    auto
    solver:            bwd_euler
    fp64:              True
    mse_weight:        0.0          # NO plain MSE
    blur_weight:       0.0
    dtw_weight:        0.0
    efel_weight:       0.25         # lowered from 1.0 -- feature loss diverges at 1.0
    efel_nmax:         24
    # 19 features: dropped the 3 broken surrogates (spike_half_width r=0.07,
    # fast_AHP_change r=-0.14, AHP_slow_time r=0.16) that inject noisy gradients.
    efel_features:     [mean_frequency, AP_amplitude, AHP_depth_abs_slow,
                        time_to_first_spike, inv_first_ISI,
                        ISI_CV, ISI_values, adaptation_index,
                        ap_upstroke_dvdt, ap_downstroke_dvdt, depol_fraction,
                        kdr_repol_slope, isi_adaptation_slope, slow_ahp_deepening,
                        voltage_base, steady_state_voltage_stimend, voltage_deflection,
                        minimum_voltage, AUC]
    range_penalty_weight: 0.0
model:
    myId:    ca3_vo_allfeat_chaoticramp
    comment: voltage-only, all 22 combined features, chaoticRamp
    outputSize_override: 6
    num_cnn_blocks: 2
    conv_block: { filter: [30, 90, 180], kernel: [4, 4, 4], pool: [4, 4, 4] }
    instance_norm_slot:  -9
    layer_norm:          False
    batch_norm_cnn_slot: 3
    batch_norm_flat:     True
    fc_block: { dims: [512, 512, 512, 256, 128], dropFrac: 0.04 }
