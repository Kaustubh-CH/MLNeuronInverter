# MODEL LADDER (l5ttpc_nc2, 5k50kInterChaoticB, supervised param-MSE).
# Generated by scripts/make_ladder_designs.py -- see docs/model_ladder/README.md.
# Pack: /global/homes/k/ktub1999/model_ladder_data/l5ttpc_nc2_5k50kInterChaoticB/l5ttpc_nc2_synth.mlPack1.h5 (stim scaled by the cell module's _STIM_SCALE, recorded in meta).
# 1 data probe(s); voltage loss uses the soma (probe 0).

data_path:
  perlmutter: /global/homes/k/ktub1999/model_ladder_data/l5ttpc_nc2_5k50kInterChaoticB/

data_conf:
    serialize_stims:  True
    append_stim:      False
    parallel_stim:    False
    num_data_workers: 4

max_epochs: 100
batch_size: 128

use_manual_features: False
const_local_batch: True
validation_period: [1, 1]
log_freq_per_epoch: 8
tb_show_graph: False
save_checkpoint: True
resume_checkpoint: False
do_ray: False
model_type: CNN

opt_pytorch:
    amp:       False
    apex:      False
    autotune:  False
    zerograd:  False

train_conf:
    warmup_epochs: 0
    optimizer: [adam, 0.0003]
    LRsched:   { plateau_patience: 10, reduceFactor: 0.3 }
    clip_grad_norm: 0

use_voltage_loss: False
voltage_loss:
    # supervised param-MSE; this block only documents the simulator for evaluate_voltage
    cell_name_for_sim: l5ttpc
    channel_weight:    1.0
    voltage_weight:    0.0
    mask_channels:     False
    stim_name:         5k50kInterChaoticB
    soma_probe_index:  0
    clamp_unit_tanh:   True         # tanh-bounded outputs (project_ca3_supervised_tanh)
    t_max_override:    auto
    solver:            bwd_euler
    fp64:              True

model:
    myId:    ladder_l5ttpc_nc2_icb_sup
    comment: model ladder l5ttpc_nc2 5k50kInterChaoticB sup
    outputSize_override: 19
    num_cnn_blocks: 2
    conv_block:
        filter: [30, 90, 180]
        kernel: [4,  4,  4]
        pool:   [4,  4,  4]
    instance_norm_slot:  -9
    layer_norm:          False
    batch_norm_cnn_slot: 3
    batch_norm_flat:     True
    fc_block:
       dims:    [512, 512, 512, 256, 128]
       dropFrac: 0.04
