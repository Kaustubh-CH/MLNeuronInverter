# CA3 — 2-param (leak, kd) BASE training with the DTW+eFEL champion loss.
# Same 80k synthetic rig-Roy2000 pack and model as ca3_roy2k_vo2p, but the
# voltage term is the dtw_amp recipe (soft-DTW 1.0, gamma 0.1, 256 pts, 8 ms
# band; scheduled light eFEL 0.05->0.2 on voltage_base+AP_amplitude; NO MSE).
# 100 epochs x 20k samples/epoch (matches the MSE main run's budget);
# resume_checkpoint True so the run survives interactive-allocation walls.

data_path:
  perlmutter: /pscratch/sd/k/ktub1999/synthetic_ca3_data/ca3_roy2k_vo2p/

data_conf:
    serialize_stims:  True
    append_stim:      False
    parallel_stim:    False
    num_data_workers: 4

max_epochs: 100
batch_size: 128

use_manual_features: False

const_local_batch: True
validation_period: [1, 1]

log_freq_per_epoch: 8
tb_show_graph: False

save_checkpoint: True
resume_checkpoint: True

do_ray: False
model_type: CNN

opt_pytorch:
    amp:       False
    apex:      False
    autotune:  False
    zerograd:  False

train_conf:
    warmup_epochs: 0
    optimizer: [adam, 0.0001]
    LRsched:   { plateau_patience: 10, reduceFactor: 0.3 }
    clip_grad_norm: 1.0

use_voltage_loss: True
voltage_loss:
    cell_name_for_sim: ca3_pyramidal
    channel_weight:    0.0
    voltage_weight:    1.0
    mask_channels:     True
    # ── champion dtw_amp loss mix ──
    mse_weight:        0.0
    dtw_weight:        1.0
    dtw_gamma:         0.1
    dtw_n_points:      256
    dtw_band_ms:       8.0
    efel_weight:       0.2
    efel_features:     [voltage_base, AP_amplitude]
    schedule:
        efel_weight: {start: 0.05, end: 0.2, epochs: 20}
    # ── sim config (matches the pack: trim 1000 bins) ──
    stim_name:         Roy2000_icav2_5k
    param_subset:      [0, 5]       # CA3_g_leak, CA3_gkdbar_kd
    soma_probe_index:  0
    sim_t_skip_ms:     100.0
    clamp_unit_tanh:   True
    t_max_override:    auto
    solver:            bwd_euler
    fp64:              True
    phys_par_range:
        - [3.9417e-05, 0.5, "S/cm^2"]   # CA3_g_leak       <- predicted
        - [0.04,       0.5, "S/cm^2"]   # CA3_gbar_na3        (pinned)
        - [0.01,       0.5, "S/cm^2"]   # CA3_gkdrbar_kdr     (pinned)
        - [0.04,       0.5, "S/cm^2"]   # CA3_gkabar_kap      (pinned)
        - [0.00052,    0.5, "S/cm^2"]   # CA3_gbar_km         (pinned)
        - [0.00025,    0.5, "S/cm^2"]   # CA3_gkdbar_kd    <- predicted

model:
    myId:    ca3_roy2k_vo2p_dtw
    comment: 2-param DTW+efel base training under exact rig Roy2000 stim, 80k pack
    outputSize_override: 2
    num_cnn_blocks: 2
    conv_block:
        filter: [30, 90, 180]
        kernel: [128, 128, 128]
        pool:   [4,  4,  4]

    instance_norm_slot:  -9
    layer_norm:          False
    batch_norm_cnn_slot: 3
    batch_norm_flat:     True

    fc_block:
       dims:    [512, 512, 512, 256, 128]
       dropFrac: 0.04
