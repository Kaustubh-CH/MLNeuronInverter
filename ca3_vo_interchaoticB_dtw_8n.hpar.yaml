# CA3 Pyramidal — VOLTAGE-ONLY + soft-DTW, 8-NODE (32-GPU) variant of
# ca3_vo_chaoticramp_dtw.hpar.yaml. IDENTICAL recipe; ONLY batch_size changes
# 128 -> 64 so that with const_local_batch=True the GLOBAL batch stays 2048 on
# 32 GPUs (64 x 32 = 2048), reproducing the exact effective training of the
# 16-GPU/128/2048 40k & 80k runs (same global batch, same LR 1e-4) at ~2x
# throughput. Used only for the 200k data-scaling ceiling run. STRICTLY
# voltage-only (channel_weight 0, mask_channels True) — ion channels never in loss.

data_path:
  perlmutter: /pscratch/sd/k/ktub1999/synthetic_ca3_data/ca3_5kinterchaoticB_v1/

data_conf:
    serialize_stims:  True
    append_stim:      False
    parallel_stim:    False
    num_data_workers: 4

max_epochs: 100
batch_size: 64

use_manual_features: False
const_local_batch: True
validation_period: [1, 1]
log_freq_per_epoch: 8
tb_show_graph: False
save_checkpoint: True
resume_checkpoint: False
do_ray: False
model_type: CNN

opt_pytorch:
    amp:       False
    apex:      False
    autotune:  False
    zerograd:  False

train_conf:
    warmup_epochs: 0
    optimizer: [adam, 0.0001]
    LRsched:   { plateau_patience: 10, reduceFactor: 0.3 }
    clip_grad_norm: 1.0

use_voltage_loss: True
voltage_loss:
    cell_name_for_sim: ca3_pyramidal
    channel_weight:    0.0
    voltage_weight:    1.0
    mask_channels:     True
    stim_name:         5k50kInterChaoticB
    soma_probe_index:  0
    clamp_unit_tanh:   True
    range_penalty_weight: 0.0
    t_max_override:    auto
    solver:            bwd_euler
    fp64:              True
    # loss = PURE soft-DTW (no MSE anchor, efel OFF) -- user directive
    mse_weight:        0.0
    dtw_weight:        1.0
    dtw_gamma:         0.1
    dtw_n_points:      256
    dtw_band_ms:       8.0
    efel_weight:       0.0
    smooth_sigma:      0.0
    smooth_samples:    1
    lowpass_ms:        0.0

model:
    myId:    ca3_vo_interchaoticB_dtw_8n
    comment: CA3 voltage-only + soft-DTW on 5k50kInterChaoticB, 8-node global-batch-2048, 200k
    outputSize_override: 6
    num_cnn_blocks: 2
    conv_block:
        filter: [30, 90, 180]
        kernel: [4,  4,  4]
        pool:   [4,  4,  4]
    instance_norm_slot:  -9
    layer_norm:          False
    batch_norm_cnn_slot: 3
    batch_norm_flat:     True
    fc_block:
       dims:    [512, 512, 512, 256, 128]
       dropFrac: 0.04
